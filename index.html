<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hion Shop — Розыгрыш</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --hint-color: #707579;
            --button-color: #000000;
            --button-text-color: #ffffff;
            --card-bg: #f4f4f5;
        }

        body.dark {
            --bg-color: #18181a;
            --text-color: #ffffff;
            --hint-color: #999999;
            --button-color: #ffffff;
            --button-text-color: #000000;
            --card-bg: #232326;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 16px;
            object-fit: cover;
            background-color: #ddd;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
        }

        p {
            font-size: 14px;
            color: var(--hint-color);
            margin: 0 0 24px 0;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 50px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Если у тебя есть аватарка в репозитории, замени src на "./avatar.png" -->
        <img src="https://via.placeholder.com/80" alt="Hion Shop" class="avatar" id="avatarImg">
        <h1 id="shopTitle">Hion Shop</h1>
        <p id="shopDesc">Участвуйте в розыгрыше призов прямо сейчас.</p>
        
        <button class="btn" id="participateBtn" onclick="submitData()">Участвовать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Автоматическая адаптация под темную/светлую тему Telegram
        if (tg.colorScheme === 'dark') {
            document.body.classList.add('dark');
        }

        // Получаем параметры розыгрыша из URL ссылки кнопки
        const urlParams = new URLSearchParams(window.location.search);
        const gwId = urlParams.get('gw_id');
        const btnColor = urlParams.get('color');

        const btn = document.getElementById('participateBtn');
        if (btnColor) {
            btn.style.backgroundColor = decodeURIComponent(btnColor);
            // Автоматически подбираем цвет текста на кнопке (черный или белый)
            btn.style.color = '#ffffff'; 
        }

        async function submitData() {
            btn.disabled = true;
            btn.innerText = "Проверка...";

            // Достаем данные пользователя из Telegram SDK
            const user = tg.initDataUnsafe?.user || { id: 12345678, username: "TestUser" };

            const payload = {
                gw_id: gwId || 1, // Если открыто вне бота, берем заглушку
                user_id: user.id,
                username: user.username || "Anonymous"
            };

            try {
                // ТВОЯ АКТУАЛЬНАЯ ССЫЛКА ОТ NGROK:
                const response = await fetch('https://jasmine-pregnancy-untried.ngrok-free.dev/api/participate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    if (result.status === 'success') {
                        btn.innerText = "✅ Вы участник!";
                        tg.showAlert("Вы успешно зарегистрированы в розыгрыше!");
                    } else if (result.status === 'already_participating') {
                        btn.innerText = "Вы уже участвуете";
                        tg.showAlert("Вы уже принимаете участие в этом розыгрыше!");
                    }
                } else {
                    btn.disabled = false;
                    btn.innerText = "Участвовать";
                    tg.showAlert("Ошибка сервера. Попробуйте позже.");
                }
            } catch (error) {
                console.error(error);
                btn.disabled = false;
                btn.innerText = "Участвовать";
                tg.showAlert("Ошибка сети. Проверьте соединение.");
            }
        }
    </script>
</body>
</html>
</html>
